<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise</title>
    <link rel="stylesheet" href="Layout-Exercise3.css">
</head>
<body>
    <div class="background-wrapper">
        <div class="form-container">
            <div class="form-header">
                <h2>Contact Form</h2>
                <p>Get in touch with us</p>
            </div>
            
            <form>
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Email Address</label>
                        <input type="email">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Subject</label>
                        <select>
                            <option>Select a topic</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select>
                            <option>Low</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group full-width">
                        <label>Message</label>
                        <textarea rows="3" placeholder="Tell us how we can help..."></textarea>
                    </div>
                </div>

                <div class="preferences-section">
                    <label class="main-label">Contact Preferences</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox"> Email Updates
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox"> Phone Follow-up
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox"> Newsletter
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-draft">Save Draft</button>
                    <button type="button" class="btn-send">Send Message</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
