<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise - Responsive Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ex3-gallery-wrapper">
    <div class="ex3-gallery-container">
        
        <div class="ex3-gallery-item">
            <a href="https://craftly.co.il/cdn/shop/files/5bdc1011d9eb8d138d3a04df8dcae3e3.jpg?v=1750158175&width=700" target="_blank" class="ex3-gallery-link">
                <img src="https://craftly.co.il/cdn/shop/files/5bdc1011d9eb8d138d3a04df8dcae3e3.jpg?v=1750158175&width=700" alt="Gallery Image 1">
                <div class="ex3-text-overlay">Art Portrait</div>
            </a>
        </div>

        <div class="ex3-gallery-item">
            <a href="https://img.joomcdn.net/9b500e72567582bd168f222b14158c0d86cd683a_original.jpeg" target="_blank" class="ex3-gallery-link">
                <img src="https://img.joomcdn.net/9b500e72567582bd168f222b14158c0d86cd683a_original.jpeg" alt="Gallery Image 2">
                <div class="ex3-text-overlay">Neon Style</div>
            </a>
        </div>

        <div class="ex3-gallery-item">
            <a href="https://i.ytimg.com/vi/IfGM7mEPBOo/maxresdefault.jpg" target="_blank" class="ex3-gallery-link">
                <img src="https://i.ytimg.com/vi/IfGM7mEPBOo/maxresdefault.jpg" alt="Gallery Image 3">
                <div class="ex3-text-overlay">Illustration</div>
            </a>
        </div>

        <div class="ex3-gallery-item">
            <a href="https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcRSSw_Ar6SfEDLy06onqAVtEUPtDGZ5QT7UgiWDjL28ls92JdAXHAEhqy1PhrMmDwUeKdMf55Psk6DSlh858gEWkxi4c1tIOPi3TzbeIx6-Q513XBY-2Nep&usqp=CAc" target="_blank" class="ex3-gallery-link">
                <img src="https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcRSSw_Ar6SfEDLy06onqAVtEUPtDGZ5QT7UgiWDjL28ls92JdAXHAEhqy1PhrMmDwUeKdMf55Psk6DSlh858gEWkxi4c1tIOPi3TzbeIx6-Q513XBY-2Nep&usqp=CAc" alt="Gallery Image 4">
                <div class="ex3-text-overlay">Action Figure</div>
            </a>
        </div>

        <div class="ex3-gallery-item">
            <a href="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/29/92/3f/78/caption.jpg?w=900&h=500&s=1" target="_blank" class="ex3-gallery-link">
                <img src="https://dynamic-media-cdn.tripadvisor.com/media/photo-o/29/92/3f/78/caption.jpg?w=900&h=500&s=1" alt="Gallery Image 5">
                <div class="ex3-text-overlay">Landscape</div>
            </a>
        </div>

        <div class="ex3-gallery-item">
            <a href="https://i.pinimg.com/236x/7d/14/08/7d14088b6fe72dd629b5f6f0d99f7473.jpg" target="_blank" class="ex3-gallery-link">
                <img src="https://i.pinimg.com/236x/7d/14/08/7d14088b6fe72dd629b5f6f0d99f7473.jpg" alt="Gallery Image 6">
                <div class="ex3-text-overlay">Character Design</div>
            </a>
        </div>

    </div>
</div>

</html>
